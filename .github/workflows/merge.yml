name: Merge Jild 16 tashreeh
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge chunks
        run: python3 merge_jild16.py
      - name: Verify merged file
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('jild-16.json', encoding='utf-8'))
          items = d['masail']
          pages = set()
          for it in items:
              pages.update(it['pages'])
          print('items:', len(items))
          print('unique pages:', len(pages), 'min:', min(pages), 'max:', max(pages))
          print('ids unique:', len(set(it['id'] for it in items)) == len(items))
          print('empty jawab:', sum(1 for it in items if not it.get('tashreeh_jawab')))
          print('with sawal:', sum(1 for it in items if it.get('tashreeh_sawal')))
          print('volume_ids:', sorted(set(it.get('volume_id') for it in items)))
          print('start_page==min(pages) all:', all(it.get('start_page') == min(it['pages']) for it in items))
          combined = {
              'jild16-masala-46-48': [142, 143, 144, 145],
              'jild16-masala-83-87': [220, 221, 222, 223],
              'jild16-masala-149': list(range(309, 318)),
              'jild16-masala-211': [420, 421, 422],
              'jild16-masala-359': [569, 570, 571],
              'jild16-masala-277': list(range(469, 474)),
              'jild16-masala-319': list(range(515, 523)),
              'jild16-masala-428': list(range(614, 626)),
          }
          for cid, expected_pages in combined.items():
              hits = [it for it in items if it['id'] == cid]
              print(cid, 'items:', len(hits), 'pages:', hits[0]['pages'][0], '-', hits[0]['pages'][-1], f'({len(hits[0]["pages"])} pages)' if hits else None)
              assert len(hits) == 1
              assert hits[0]['pages'] == expected_pages, f'{cid}: pages mismatch'
          # absorbed cross-id tails must be gone
          for sid in ['jild16-p470', 'jild16-p521', 'jild16-p625']:
              assert not any(it['id'] == sid for it in items), f'{sid} should have been combined away'
          print('3 absorbed cross-id tails gone')
          # rule 2: qawwal masala-83 [220] must remain exactly once;
          # chunk 05's mislabelled masala-83 [221-223] must be gone
          qawwal = [it for it in items if it['id'] == 'jild16-masala-83']
          assert len(qawwal) == 1 and qawwal[0]['start_page'] == 220, 'qawwal masala-83 [220] must remain exactly once'
          print('qawwal jild16-masala-83 [220] kept; mislabelled chunk-05 masala-83 absorbed into masala-83-87')
          # distinct items kept separate
          for did in ['jild16-p539', 'jild16-masala-335', 'jild16-khatima',
                      'jild16-pesh-lafz', 'jild16-hamd', 'jild16-masala-185']:
              assert any(it['id'] == did for it in items), f'missing distinct item {did}'
              print(did, 'present')
          assert len(items) == 269
          assert len(pages) == 542
          assert min(pages) == 4 and max(pages) == 636
          assert len(set(it['id'] for it in items)) == len(items)
          assert all(it.get('tashreeh_jawab') for it in items)
          print('VERIFICATION PASSED')
          EOF
      - name: Create release with merged file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la jild-16.json
          gh release create v1.0 jild-16.json --title "Jild 16 tashreeh - merged" --notes "Merged tashreeh for Fatawa Razviya Jild 16: 269 items, 542 pages (volume_id 52). Generated by merge_jild16.py from the 13 chunk files; 8 combine cases (masala-46-48, masala-83-87 rename+combine, masala-149, masala-211, masala-359, masala-277, masala-319, masala-428)." || gh release upload v1.0 jild-16.json --clobber
